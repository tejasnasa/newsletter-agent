[project]
name = "newsletter-agent"
version = "0.1.0"
description = "Autonomous AI agent that researches AI agent news and produces a newsletter."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Agent orchestration. Pinned exactly: 1.x is a major release and
    # `interrupt` / `Command` / the checkpointer import path move between versions.
    "langgraph==1.2.15",
    # LLM access: any OpenAI-compatible provider, via the `openai` SDK.
    # Pinned exactly so a major bump cannot silently change `chat.completions`.
    "openai==3.31.0",
    "httpx>=0.28.1",
    "feedparser>=6.0.11",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11.0",
    "jinja2>=3.1.6",
    "fastapi>=0.143.1",
    # Plain uvicorn, not uvicorn[standard]: uvloop/httptools are painful on Windows.
    "uvicorn>=0.54.0",
]

[project.scripts]
newsletter-agent = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits the real network (HN Algolia, RSS feeds, article URLs)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
